name: Windows credential verification
on:
  push:
    branches: [verify/windows-credential-031]
permissions:
  contents: read
jobs:
  credentials:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,auth]'
      - run: python -m pytest -q tests/test_auth.py tests/test_platform_connections.py

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atbots"
version = "0.3.1"
description = "Pydantic AI, already set up: a general-purpose agent with tasks, skills, and pluggable memory."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "atmem>=2.3.10,<3",
  "pydantic>=2.7",
  "pydantic-ai-slim[openai]>=2.61,<3",
  "filelock>=3.15,<4",
  "keyring>=25,<26",
  "APScheduler>=3.11,<4",
  "tzdata>=2025.1",
  "pydantic-ai-slim[anthropic]>=2.61,<3",
  "atsys>=0.3.0b4,<0.4",
  "packaging>=24",
]

[project.urls]
Homepage = "https://github.com/aetna000/atbots"
Repository = "https://github.com/aetna000/atbots"
Issues = "https://github.com/aetna000/atbots/issues"

[project.optional-dependencies]
browser = ["playwright>=1.50,<2", "cryptography>=43", "pydantic-ai-slim[mcp]>=2.61,<3", "mcp>=2.3,<3"]
schedule = ["APScheduler>=3.11,<4", "tzdata>=2025.1"]
supervision = ["atsys>=0.3.0b4,<0.4", "packaging>=24"]
cloud = ["google-cloud-storage>=3,<4", "cryptography>=43", "APScheduler>=3.11,<4"]
auth = [
  "pydantic-ai-slim[openai]>=2.61,<3",
  "keyring>=25,<26",
  "filelock>=3.15,<4",
]
anthropic = [
  "pydantic-ai-slim[anthropic]>=2.61,<3",
]
evals = [
  "pydantic-evals>=2.40,<3",
  "python-dotenv>=1,<2",
]
dev = [
  "pytest>=8.0",
  "atbots[evals]",
]

[project.scripts]
atbots = "atbots.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"atbots.platform" = ["*.html", "*.js", "*.css", "*.md", "*.Dockerfile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root is on the path so the non-shipped `evals` package imports.
pythonpath = ["src", "."]
# Tier 2 evals talk to a real model server: opt in with `-m eval`.
addopts = "-m 'not eval'"
markers = [
  "eval: live-model evaluation; needs Ollama, excluded from the default gate",
]

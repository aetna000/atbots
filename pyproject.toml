[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atbots"
version = "0.1.0a1"
description = "Pydantic AI, already set up: a general-purpose agent with tasks, skills, and pluggable memory."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "atmem>=2.1,<3",
  "pydantic-ai-slim[openai]>=1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
atbots = "atbots.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
